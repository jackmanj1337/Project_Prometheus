<svg xmlns="http://www.w3.org/2000/svg" width="642" height="362" viewBox="0 0 642 362" role="img" aria-label="Main Menu at 1280 by 720, Expanded">
  <title>Main Menu at 1280 by 720, Expanded</title>
  <style>
    :root{
      --ink:#16201F; --muted:#5F6E6B; --faint:#8A9895;
      --rule:#D2DAD8; --rule-strong:#B4C0BD; --surface-2:#E8EDEB;
      --accent:#9A620F; --alert:#96382B; --ok:#1C6058;
      --wf-canvas:#FFFFFF; --wf-row:#E9EEEC; --wf-rowsel:#F0E2C6;
      --wf-hdr:#DDE5E3; --wf-btn:#E2E9E7; --wf-dev:#F7F9F8; --hatch:#C3CFCC;
      --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#E6ECEA; --muted:#93A19E; --faint:#6C7A77;
        --rule:#293533; --rule-strong:#3A4947; --surface-2:#1D2726;
        --accent:#E3A340; --alert:#D9705E; --ok:#4FB0A3;
        --wf-canvas:#1B2523; --wf-row:#232F2D; --wf-rowsel:#3B3016;
        --wf-hdr:#2A3634; --wf-btn:#283432; --wf-dev:#131B1A; --hatch:#33403D;
      }
    }
    .dev{fill:var(--wf-dev);stroke:var(--ink);stroke-width:1.5}
    .cv{fill:var(--wf-canvas);stroke:var(--rule-strong);stroke-width:1}
    .ctrl{fill:url(#hx);stroke:var(--rule-strong);stroke-width:1}
    .row{fill:var(--wf-row)} .rowsel{fill:var(--wf-rowsel)}
    .hdr{fill:var(--wf-hdr)} .btn{fill:var(--wf-btn);stroke:var(--rule);stroke-width:.8}
    .pane{fill:var(--wf-canvas);stroke:var(--rule);stroke-width:.8}
    .map{fill:var(--surface-2);stroke:var(--rule-strong);stroke-width:.8}
    .t{font-family:var(--mono);font-size:8px;fill:var(--ink);font-weight:500}
    .ts{font-family:var(--mono);font-size:7px;fill:var(--muted)}
    .tb{font-family:var(--mono);font-size:8.5px;fill:var(--ink);font-weight:650;letter-spacing:.04em}
    .rl{font-family:var(--mono);font-size:6.5px;fill:var(--accent);font-weight:650;letter-spacing:.04em}
    .dim{font-family:var(--mono);font-size:6.5px;fill:var(--faint)}
    .safe{fill:none;stroke:var(--accent);stroke-dasharray:3 2.5;stroke-width:.9}
    .glyph{fill:var(--muted)} .glyph-a{fill:var(--accent)}
    .ctrlbtn{fill:var(--wf-btn);stroke:var(--rule-strong);stroke-width:.8}
    .defect{fill:none;stroke:var(--alert);stroke-width:1.2;stroke-dasharray:2 2}
    .trk{fill:var(--rule)} .grb{fill:var(--accent)}
  </style>
  <defs>
    <pattern id="hx" width="6" height="6" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="var(--wf-dev)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="1.6"/>
    </pattern>
  </defs>

        <rect x="1" y="1" width="640" height="360" rx="3" class="dev"/>
        <rect x="1" y="1" width="640" height="360" class="cv"/>
        <rect x="17" y="17" width="606" height="36" class="hdr"/>
        <text x="25" y="39" class="tb">PROMETHEUS</text>
        <text x="556" y="28" class="rl">[header]</text>
        <rect x="17" y="61" width="200" height="24" class="rowsel"/><text x="23" y="76" class="t">&#9656; Continue</text>
        <rect x="17" y="89" width="200" height="24" class="row"/><text x="28" y="104" class="t">New Game</text>
        <rect x="17" y="117" width="200" height="24" class="row"/><text x="28" y="132" class="t">Load Game</text>
        <rect x="17" y="145" width="200" height="24" class="row"/><text x="28" y="160" class="t">Campaign Library</text>
        <rect x="17" y="173" width="200" height="24" class="row"/><text x="28" y="188" class="t">Settings</text>
        <rect x="17" y="201" width="200" height="24" class="row"/><text x="28" y="216" class="t">Credits</text>
        <rect x="17" y="229" width="200" height="24" class="row"/><text x="28" y="244" class="t">Quit</text>
        <text x="150" y="57" class="rl">[list_row]</text>
        <rect x="229" y="61" width="250" height="230" class="pane"/>
        <text x="236" y="74" class="rl">[detail_pane]</text>
        <text x="236" y="92" class="t">Proving Grounds</text>
        <text x="236" y="108" class="ts">Chapter 4 &#8212; The Ford of Kell</text>
        <text x="236" y="122" class="ts">Turn 11 &#183; Player phase</text>
        <text x="236" y="142" class="ts">7 units deployed &#183; 2 wounded</text>
        <text x="236" y="156" class="ts">0 lost &#183; Classic</text>
        <text x="236" y="178" class="ts">Saved 2026-08-11 22:14</text>
        <text x="236" y="192" class="ts">Pack v0.4.1 &#183; format 3</text>
        <rect x="491" y="61" width="132" height="230" class="pane"/>
        <text x="498" y="74" class="rl">[action]</text>
        <rect x="498" y="84" width="118" height="24" class="btn"/><text x="524" y="99" class="t">Resume</text>
        <rect x="498" y="112" width="118" height="24" class="btn"/><text x="522" y="127" class="t">Details</text>
        <rect x="498" y="140" width="118" height="24" class="btn"/><text x="518" y="155" class="t">Manage</text>
        <rect x="17" y="311" width="606" height="32" class="hdr"/>
        <text x="25" y="330" class="ts">v0.8.0 &#183; BUILD 116eaff7 &#183; Expanded</text>
        <text x="530" y="330" class="ts">1280 &#215; 720</text>
        <text x="556" y="307" class="rl">[footer]</text>
      </svg>
