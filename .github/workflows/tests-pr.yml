name: Tests PR

on:
  pull_request:

jobs:
  godot-tests-pr:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: 4.6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check_docs.py reads git log for the stale-date check

      - name: Documentation checks (DOC-011)
        run: python3 AGENT/Docs/check_docs.py

      - name: RNG-usage guard
        run: bash scripts/ci/check_rng_usage.sh

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            unzip \
            libx11-6 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            libxi6 \
            libgl1 \
            libglu1-mesa \
            libfontconfig1

      - name: Install Godot
        run: |
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Run headless tests
        run: bash scripts/ci/run_headless_tests.sh
