services:
  godot-claude:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GODOT_VERSION: "4.3"
        NODE_MAJOR: "20"
    image: godot-claude-code:latest
    container_name: godot-claude-dev

    volumes:
      - .:/workspace
      - developer-home:/home/developer

    stdin_open: true
    tty: true

    working_dir: /workspace

    restart: unless-stopped

volumes:
  developer-home:
