<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything
		     other than 0px on a notched iPhone. Without it Safari letterboxes the page
		     in landscape and the game never learns where the Dynamic Island is. -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<!-- iOS honours manifest display:standalone only from 17.4; the legacy meta is
		     what removes Safari's chrome on older versions, and it is harmless on new
		     ones. iPhone has no Fullscreen API at all, so standalone is the ONLY way
		     this game runs without a browser bar. -->
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<!-- Godot's generated manifest carries no theme_color, so set it here. -->
		<meta name="theme-color" content="#14142b">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

/* The shell positions and sizes the canvas (export canvas_resize_policy=0), so it
   is taken out of flow. The 100% default matters: it is what a desktop browser —
   where no controller installs and nothing ever calls PrometheusWebLayout.apply()
   — keeps forever, so that path is byte-for-byte the old full-window behaviour. */
#canvas {
	display: block;
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* --- PWA additions below this line; everything above matches the stock 4.6.3 shell --- */

/* Published as CSS custom properties so JS can read the resolved pixel values
   through getComputedStyle. env() cannot be read directly from script. */
:root {
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
	--safe-left: env(safe-area-inset-left, 0px);
}

/* The portrait rotate-gate that used to live here is GONE. It existed because the
   1280x720 UI clipped in portrait and the canvas always filled the window, so
   portrait was genuinely unplayable. With export canvas_resize_policy=0 the shell
   owns the canvas rectangle, so portrait now renders the game into the top of the
   screen and gives the rest to the controller — which is the point of the layout
   model. Re-adding a rotate gate would re-break that. */
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// --- PWA bridge surface -------------------------------------------------
// DisplayServerWeb implements no safe-area support, so get_display_safe_area()
// reports the whole window on web and the game draws under the Dynamic Island.
// These helpers are what GDScript reads through JavaScriptBridge.eval() to get
// real values. Kept dependency-free and side-effect-free so the engine can call
// them at any point in its boot.
let persisted = false;

// --- Canvas rectangle -----------------------------------------------------
// The shell owns the canvas rectangle; Godot owns the model that decides what it
// should be. Split that way because only the browser can put anything OUTSIDE the
// canvas, which is the whole point: the controller lives in reclaimed screen area
// instead of covering the game.
//
// With export canvas_resize_policy=0 Godot never touches the canvas — not its CSS
// box and not its backing store. That is what lets us shrink it, but it also means
// the backing store is now OUR responsibility: left alone it stays at the HTML
// default of 300x150 and the entire game renders into a postage stamp. So this
// applies a full-window rect immediately, before the engine boots, and Godot
// narrows it later once the controller layout is known.
window.PrometheusWebLayout = (function () {
	const canvas = document.getElementById('canvas');
	let applied = null;

	function metrics() {
		return {
			width: window.innerWidth,
			height: window.innerHeight,
			dpr: window.devicePixelRatio || 1,
			orientation: window.innerHeight > window.innerWidth ? 'portrait' : 'landscape',
		};
	}

	function clamp(value, low, high) {
		const n = Number(value);
		if (!Number.isFinite(n)) {
			return low;
		}
		return Math.min(Math.max(n, low), high);
	}

	// `rect` is in CSS pixels and comes from Godot, which has already clamped it
	// against the layout model's minimum. Clamping again here is not distrust of
	// the engine — the window can change size between the metrics report and this
	// call, and a stale rect must not push the canvas off-screen.
	function apply(rect) {
		if (!rect || typeof rect !== 'object') {
			return false;
		}
		const m = metrics();
		const x = clamp(rect.x, 0, m.width);
		const y = clamp(rect.y, 0, m.height);
		const width = clamp(rect.width, 1, Math.max(1, m.width - x));
		const height = clamp(rect.height, 1, Math.max(1, m.height - y));
		canvas.style.left = x + 'px';
		canvas.style.top = y + 'px';
		canvas.style.width = width + 'px';
		canvas.style.height = height + 'px';
		// Backing store in device pixels: this is what sets the engine's viewport
		// resolution under policy 0, and it is why a DPR-3 phone still gets a sharp
		// canvas instead of an upscaled one.
		canvas.width = Math.round(width * m.dpr);
		canvas.height = Math.round(height * m.dpr);
		applied = { x: x, y: y, width: width, height: height };
		return true;
	}

	function fill() {
		const m = metrics();
		return apply({ x: 0, y: 0, width: m.width, height: m.height });
	}

	fill();

	return {
		apply: function (rectJson) {
			try {
				return apply(typeof rectJson === 'string' ? JSON.parse(rectJson) : rectJson);
			} catch (err) {
				return false;
			}
		},
		// Everything Godot needs to turn the model's fractional rect into pixels.
		query: function () {
			return JSON.stringify(metrics());
		},
		fill: fill,
		current: function () {
			return JSON.stringify(applied);
		},
	};
})();

window.PrometheusPWA = (function () {
	function readInset(name) {
		const raw = getComputedStyle(document.documentElement).getPropertyValue(name);
		const parsed = parseFloat(raw);
		return Number.isFinite(parsed) ? parsed : 0;
	}

	return {
		// CSS pixels. Multiply by devicePixelRatio for engine-space pixels.
		safeArea: function () {
			return {
				top: readInset('--safe-top'),
				right: readInset('--safe-right'),
				bottom: readInset('--safe-bottom'),
				left: readInset('--safe-left'),
			};
		},
		// The canvas rectangle in CSS pixels. The engine divides its own
		// DisplayServer.window_get_size() by this to learn how many engine
		// pixels one CSS pixel is worth, instead of trusting devicePixelRatio
		// to describe the backing buffer — whether it does depends on the
		// export's hidpi handling, and a wrong ratio silently mis-sizes every
		// safe-area inset.
		canvasCssSize: function () {
			const canvas = document.getElementById('canvas');
			if (!canvas) {
				return { width: 0, height: 0 };
			}
			const rect = canvas.getBoundingClientRect();
			return { width: rect.width, height: rect.height };
		},
		// True when launched from the home screen rather than a browser tab.
		// This is the state that exempts storage from Safari's 7-day cap.
		isStandalone: function () {
			return window.navigator.standalone === true
				|| window.matchMedia('(display-mode: standalone)').matches;
		},
		isPersisted: function () {
			return persisted;
		},
		devicePixelRatio: function () {
			return window.devicePixelRatio || 1;
		},
	};
}());

// Ask for persistent storage. WebKit grants this on heuristics that favour
// home-screen web apps; without it an origin under storage pressure is evicted
// as a whole, taking user:// (saves, settings, installed packs) with it.
// Requested once on load and once more after the first real interaction,
// because engagement is one of the heuristics.
function requestPersistentStorage() {
	if (persisted || !navigator.storage || !navigator.storage.persist) {
		return;
	}
	navigator.storage.persisted().then(function (already) {
		if (already) {
			persisted = true;
			return null;
		}
		return navigator.storage.persist().then(function (granted) {
			persisted = granted === true;
			return null;
		});
	}).catch(function () {
		// Non-fatal: the game still runs, saves are just evictable.
	});
}

requestPersistentStorage();
window.addEventListener('pointerdown', requestPersistentStorage, { once: true });
window.addEventListener('keydown', requestPersistentStorage, { once: true });

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
